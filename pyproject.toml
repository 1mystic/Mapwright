[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapwright"
version = "0.1.0"
description = "A live map of what your coding agent is building: structure, architecture, data, cloud, logic and every step, readable by the agent for a fraction of the tokens."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
keywords = ["ai-agents", "mcp", "architecture", "diagrams", "claude-code", "cursor", "copilot", "code-map", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8"]

[project.scripts]
mapwright = "mapwright.cli:main"
mw = "mapwright.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mapwright"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "integrations", "README.md", "LICENSE", "CHANGELOG.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
