[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapwright-agent"
dynamic = ["version"]
description = "A live map of what your coding agent is building: structure, architecture, data, cloud, logic and every step, readable by the agent for a fraction of the tokens."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
keywords = ["ai-agents", "mcp", "architecture", "diagrams", "claude-code", "cursor", "copilot", "code-map", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://mapwright.pages.dev"
Repository = "https://github.com/1mystic/Mapwright"
Changelog = "https://github.com/1mystic/Mapwright/blob/main/CHANGELOG.md"
Issues = "https://github.com/1mystic/Mapwright/issues"

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8"]

[project.scripts]
mapwright = "mapwright.cli:main"
mw = "mapwright.cli:main"

[tool.hatch.version]
path = "src/mapwright/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mapwright"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "integrations", "README.md", "LICENSE", "CHANGELOG.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E701", "E702", "E731", "E741",   # compact one-line style
  "B905",                           # zip() without strict=
  "E501",                           # long lines are tolerated; the 160 limit is a guide for formatters
  "B007", "B023",                   # loop variables in comprehensions/lambdas are used immediately
  "UP031",                          # '%d' formatting inside f-string arguments
  "UP037",                          # quoted annotations are kept where `from __future__` is absent
]

[tool.ruff.lint.per-file-ignores]
"src/mapwright/analyze.py" = ["I001"]
"tests/*" = ["E501", "B011"]
