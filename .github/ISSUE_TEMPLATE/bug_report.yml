name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mapwright doctor`
      render: text
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent (Claude Code, Cursor, Codex, none, ...)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
    validations:
      required: true
