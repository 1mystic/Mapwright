name: pr-report
# Manual only: Actions -> pr-report -> Run workflow, with a PR number.
# To run on every pull request instead, uncomment the pull_request trigger below.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true
  # pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.inputs.pr || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Check out the PR head and find its base
        run: |
          gh pr checkout "$PR"
          echo "BASE=$(gh pr view "$PR" --json baseRefName -q .baseRefName)" >> "$GITHUB_ENV"
      - name: Build the report
        env:
          MAPWRIGHT_HOME: ${{ runner.temp }}/mapwright
        run: |
          git fetch origin "$BASE"
          mapwright report --since "origin/$BASE" -o "$RUNNER_TEMP/report.md"
      - name: Post or update the PR comment
        run: |
          gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/report.md" \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/report.md"
